name: Main Workflow
on:
  push:
  schedule:
    - cron: "0 0 * * 0"
jobs:
  build:
    name: Build
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          2.7,
          3.5,
          3.6,
          3.7,
          3.8,
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          latest,
          rc
        ]
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - run: python --version
      - run: pip install -r requirements.txt
        if: matrix.python-version != '2.7'
      - run: pip install -r requirements.py2.txt
        if: matrix.python-version == '2.7'
      - run: |
          pip install black
          black . --check
        if: matrix.python-version == '3.14'
      - run: python setup.py test
        env:
          HTTPBIN: httpbin.bemisc.com
          PLUGIN_PATH: ./*/src;./*/*src
  build-pypy:
    name: Build PyPy
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          2.7,
          #3.6,
          #3.7,
          #3.8,
          #3.9,
          #"3.10"
        ]
    runs-on: ubuntu-latest
    container: pypy:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - run: pypy --version
      - run: pip install -r requirements.txt
        if: matrix.python-version != '2.7'
      - run: pip install -r requirements.py2.txt
        if: matrix.python-version == '2.7'
      - run: |
          pip install black
          black . --check
        if: matrix.python-version == '3.14'
      - run: pypy setup.py test
        env:
          HTTPBIN: httpbin.bemisc.com
          PLUGIN_PATH: ./*/src;./*/*src
  build-arm:
    name: Build ARM
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          "3.9",
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          latest
        ]
    runs-on: ubuntu-24.04-arm
    container: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - run: python --version
      - run: pip install -r requirements.txt
      - run: python setup.py test
        env:
          HTTPBIN: httpbin.bemisc.com
          PLUGIN_PATH: ./*/src;./*/*src
  build-pypy-arm:
    name: Build PyPy ARM
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          "2.7",
          #3.6,
          #3.7,
          #3.8,
          #3.9,
          #"3.10"
        ]
    runs-on: ubuntu-24.04-arm
    container: pypy:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - run: pypy --version
      - run: pip install -r requirements.txt
      - run: pypy setup.py test
        env:
          HTTPBIN: httpbin.bemisc.com
          PLUGIN_PATH: ./*/src;./*/*src
  build-windows:
    name: Build Windows
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          "3.5",
          "3.6",
          "3.7",
          "3.8",
          "3.9",
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python --version
      - run: pip install -r requirements.txt
      - run: |
          pip install black
          black . --check
        if: matrix.python-version == '3.14'
      - run: python setup.py test
        env:
          HTTPBIN: httpbin.bemisc.com
          PLUGIN_PATH: ./*/src;./*/*src
  build-macos:
    name: Build macOS
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          "3.9",
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python --version
      - run: pip install -r requirements.txt
      - run: |
          pip install black
          black . --check
        if: matrix.python-version == '3.14'
      - run: python setup.py test
        env:
          HTTPBIN: httpbin.bemisc.com
          PLUGIN_PATH: ./*/src;./*/*src
  build-mariadb:
    name: Build MariaDB
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          "3.13",
          "3.14"
        ]
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: colony
          MARIADB_DATABASE: colony
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - run: python --version
      - run: apt-get update && apt-get install -y mariadb-client
      - run: pip install -r requirements.txt pymysql
      - run: python setup.py test
        env:
          TEST_DB_ENGINE: mysql
          DB_HOST: mariadb
          DB_USER: root
          DB_PASSWORD: colony
          DB_NAME: colony
          HTTPBIN: httpbin.bemisc.com
          PLUGIN_PATH: ./*/src;./*/*src
  build-postgres:
    name: Build PostgreSQL
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          "3.13",
          "3.14"
        ]
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: colony
          POSTGRES_DB: colony
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - run: python --version
      - run: apt-get update && apt-get install -y postgresql-client
      - run: pip install -r requirements.txt psycopg2-binary
      - run: python setup.py test
        env:
          TEST_DB_ENGINE: pgsql
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: colony
          DB_NAME: colony
          HTTPBIN: httpbin.bemisc.com
          PLUGIN_PATH: ./*/src;./*/*src
