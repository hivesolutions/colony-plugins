name: Review Workflow
on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'opus' }}
  CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT || 'max' }}

jobs:
  review:
    name: Review with Claude
    timeout-minutes: 30
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ubuntu, latest]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Cleanup the hosted runner
        uses: joamag/cleanup-hosted@master

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Its branch is already checked out in the
            working directory, and AGENTS.md holds the conventions of the
            repository, which the review follows.

            Colony Plugins are the base plugins of the Colony Framework, loaded
            by its plugin manager and used by the solutions built on top of them
            (eg: Omni), so a change reaches code outside this repository.

            Look for, in this order:

            1. Bugs and regressions: wrong behaviour, unhandled errors and edge
               cases, entities left in an inconsistent state by the entity
               manager (relations, inheritance strategies and transactions),
               queries that behave differently on SQLite, MySQL and PostgreSQL,
               templates the compiler renders differently from the visitor,
               sockets, sessions and resources left open or not released when a
               plugin is unloaded, and anything a test should have caught.
            2. The public interface: the methods of the plugins, their
               capabilities and dependencies, and the classes the solutions
               extend (controllers, models and entities) are used from outside
               this repository, so a signature that gains an argument before the
               existing ones, a renamed or reordered parameter, a changed default
               and a removed name all break the solutions that already use them.
            3. The rules of AGENTS.md the change may break: code that runs on
               Python 2.7 and on Python 3.13 alike (without relying on the order
               of the keys of a dict, which Python 2.7 and 3.5 do not keep), no
               type annotations in the `.py` files (they belong in `.pyi` files),
               the black formatting, the CRLF line endings of the files kept as
               they are, `not item in list` and `item == None`, the commenting
               style of the project, and the version of `setup.py` not bumped.
            4. Tests: the new and changed code covered by tests written like the
               existing ones, in the `test.py` of the module with its mocks in
               `mocks.py`, every test case listed in the bundle of the test class
               of the module, the class-level state restored after each test, and
               the entity tests passing on every engine, not on SQLite alone.
            5. The documents the change should update: the unreleased section of
               the changelog, every new configuration value in the Configuration
               section of README.md (its name, type, default and description),
               and the design documents of `doc/design` that describe what
               changed.
            6. Security: secrets, injection (the SQL built by the entity engines
               included), the parsing of the requests by the HTTP service and the
               REST layer, the paths a file service is allowed to serve, the ACL
               checks of the controllers, and data reaching someone it should
               not (the errors reported to Sentry included).

            Verify every finding against the code before reporting it, reading the
            files around the diff and not the diff alone, and say how sure you
            are. Leave out what black settles, praise and restatements of what
            the change does: a short review of real findings is worth more than a
            long one.

            Report each finding as an inline comment on the line it is about,
            saying what is wrong, why it matters and how to fix it, and use a
            top-level comment for the summary: the findings by severity, or that
            none was found.

          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --effort ${{ env.CLAUDE_EFFORT }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
